<body>
<main>
<header class="heading"><p class="brand">CHAAKAN</p><h1>앉아서 찍는 부츠 컷</h1><p class="intro">촬영하실 때 아래 앉은 구도를 참고해 주세요.<br>사진을 누르면 크게 볼 수 있어요.</p></header>

<figure><button class="photo" type="button" aria-label="3번 예시 크게 보기"><img src="https://kangnaan00.github.io/connecting-3sec-guide/chakhangudu-guide/cuts/DPlLzWikZ2G_%EC%BB%B707.jpg" alt="소파에 다리를 꼬고 앉아 클로즈업" loading="lazy"></button><figcaption><span class="number">03</span><span>소파에 다리를 꼬고 앉아 클로즈업</span></figcaption></figure>

<dialog aria-label="촬영 구도 크게 보기">
<div class="viewer"><div class="viewer-top"><span id="counter"></span><button type="button" id="close">닫기 ✕</button></div><div class="image-wrap"><img id="large" alt=""></div><div class="viewer-bottom"><p id="caption"></p><div class="navigation"><button type="button" id="prev" aria-label="이전 사진">← 이전</button><button type="button" id="next" aria-label="다음 사진">다음 →</button></div></div></div>
</dialog>
<script>
const photos=[...document.querySelectorAll('.photo')],dialog=document.querySelector('dialog'),large=document.querySelector('#large');let current=0;
function show(index){current=(index+photos.length)%photos.length;const img=photos[current].querySelector('img');large.src=img.src;large.alt=img.alt;document.querySelector('#caption').textContent=img.alt;document.querySelector('#counter').textContent=(current+1)+' / '+photos.length;}
photos.forEach((button,index)=>button.addEventListener('click',()=>{show(index);dialog.showModal();document.body.style.overflow='hidden';}));
document.querySelector('#close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>{document.body.style.overflow='';photos[current].focus();});
document.querySelector('#prev').addEventListener('click',()=>show(current-1));
document.querySelector('#next').addEventListener('click',()=>show(current+1));
dialog.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();show(current-1);}if(event.key==='ArrowRight'){event.preventDefault();show(current+1);}});
</script>
