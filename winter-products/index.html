<script>
'use strict';
const products=JSON.parse(document.querySelector('#product-data').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEADLINE='2026-11-20';const DL=(()=>{const a=DEADLINE.split('-');return `${+a[1]}/${+a[2]}`})();
const n=v=>Number(v||0).toLocaleString('ko-KR');const md=d=>{const a=String(d).split('-');return `${+a[1]}/${+a[2]}`};const kday=d=>{const a=String(d).split('-');return `${+a[1]}월 ${+a[2]}일`};
const cols=p=>p.stock?p.stock.colors:[];const hasInb=p=>cols(p).some(c=>c.inbound.length);const isLow=p=>cols(p).some(c=>c.total<10);const isAmple=p=>!!(p.stock&&p.stock.ample);const stores=p=>(p.stock&&p.stock.stores)||[];
const soonOf=c=>c.inbound.filter(x=>x.mall_expected_date&&!x.mall_estimate_overdue&&x.mall_expected_date<=DEADLINE);const isSoon=p=>cols(p).some(c=>soonOf(c).length);
function nextInb(p){const all=cols(p).flatMap(c=>c.inbound);const d=all.filter(x=>x.mall_expected_date&&!x.mall_estimate_overdue).sort((a,b)=>a.mall_expected_date.localeCompare(b.mall_expected_date))[0];return d||all.find(x=>x.pending)||null}
const FILTERS=[['ample','재고 넉넉',isAmple],['soon',DL+' 전 자사몰 예상',isSoon],['store','매장 재고 있음',p=>stores(p).length>0],['inb','입고 예정 있음',hasInb],['low','품절 임박 색상',isLow],['sel','선택한 상품만',p=>selected.has(p.id)]];
const known=new Set(products.map(p=>p.id));let selected=new Set();try{const saved=JSON.parse(localStorage.getItem('chaakan-winter-2026')||'[]');if(Array.isArray(saved))selected=new Set(saved.filter(id=>known.has(id)))}catch{}
let group='전체';let visible=[];const on=new Set();
const groups=['전체','신상','방한화','가을·키높이','키즈'].filter(g=>g==='전체'||products.some(p=>p.tags.includes(g)));
$('.tabs').innerHTML=groups.map(g=>`<button class="tab" data-group="${g}" aria-pressed="${g===group}">${g}<span class="count">${g==='전체'?products.length:products.filter(p=>p.tags.includes(g)).length}</span></button>`).join('');
$('#fchips').innerHTML=FILTERS.map(([k,l])=>`<button class="fchip" data-f="${k}" aria-pressed="false">${l}<span class="count" data-fc="${k}"></span></button>`).join('');
[...new Set(products.map(p=>p.category))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('#category').append(o)});
const KPI=[['all','전체 상품',products.length],['ample','재고 넉넉',products.filter(isAmple).length],['soon',DL+' 전 자사몰 예상',products.filter(isSoon).length],['low','품절 임박',products.filter(isLow).length]];
$('#kpis').innerHTML=KPI.map(([k,l,v])=>k==='all'?`<div class="kpi static"><span>${l}</span><b>${n(v)}</b></div>`:`<button class="kpi" data-kf="${k}" aria-pressed="false"><span>${l}</span><b>${n(v)}</b></button>`).join('');
function sizeGrid(sz,mode){const e=Object.entries(sz||{});const wide=e.some(([s])=>s.length>4);return `<div class="sgrid${wide?' wide':''}">${e.map(([s,q])=>mode==='in'?`<span class="sz in">${esc(s)}<b>${n(q)}</b></span>`:q>0?`<span class="sz${q<10?' low':''}">${esc(s)}<b>${n(q)}</b></span>`:`<span class="sz out">${esc(s)}<b>품절</b></span>`).join('')}</div>`}
function inbText(x){const expected=x.mall_expected_date?`자사몰 반영 예상 ${md(x.mall_expected_date)}${x.mall_estimate_overdue?' (경과·확인 필요)':''} · ${x.mall_estimate_basis}`:'자사몰 반영일 미정';const ship=x.actual_factory_ship_date?`공장 출고 ${md(x.actual_factory_ship_date)} 확인`:x.factory_ship_date?`공장 출고예정 ${md(x.factory_ship_date)}`:'';const due=x.date?`${esc(x.destination||'창고 미상')} 원본 ${md(x.date)} ${x.date_source==='eta'?'입고예정':'완료예정'}${x.pending?' (재확인)':''}`:'';return `${expected} · ${n(x.qty)}족${ship?' · '+ship:''}${due?' · '+due:''}${x.update_note?' · '+esc(x.update_note):''}`}
function inbHtml(x){const cl=`inb${x.pending?' pending':''}`;return Object.keys(x.sizes||{}).length?`<details class="${cl}"><summary>${inbText(x)}</summary>${sizeGrid(x.sizes,'in')}${x.estimated_qty?'<small>사이즈별 수량은 일부 추정 배분입니다.</small>':''}</details>`:`<p class="${cl}">${inbText(x)}</p>`}
function storeHtml(p){const s=stores(p);if(!s.length)return '';if(s.length<=3)return `<p class="stores-line">매장 재고 있음: <b>${s.map(esc).join('·')}</b></p>`;return `<details class="more"><summary>매장 재고 있음: ${s.slice(0,3).map(esc).join('·')} 외 ${s.length-3}곳</summary><p class="stores-line"><b>${s.map(esc).join(' · ')}</b></p></details>`}
function stockHtml(p){const s=p.stock;if(!s)return '';const multi=new Set(s.colors.map(c=>c.code)).size>1;const nx=nextInb(p);const any=hasInb(p);
const next=nx?`<span class="next${nx.pending?' pending':''}">${inbText(nx)}</span>`:'<span class="next none">입고 예정 없음</span>';
const badges=[isAmple(p)?'<span class="badge b-ample">재고 넉넉</span>':'',isSoon(p)?`<span class="badge b-soon">${DL} 전 자사몰 예상</span>`:'',stores(p).length?`<span class="badge b-store">매장 ${stores(p).length}곳</span>`:''].join('');
const PMAX=6;const pills=s.colors.slice(0,PMAX).map(c=>`<span class="cpill${c.total<=0?' out':c.total<10?' low':''}">${esc(c.color)}<b>${c.total>0?n(c.total):'품절'}</b></span>`).join('')+(s.colors.length>PMAX?`<span class="cpill more-c">외 ${s.colors.length-PMAX}색</span>`:'');
const detail=s.colors.map(c=>`<div class="cblock"><div class="c-top"><span class="c-name">${esc(c.color)}${c.ample?'<span class="c-flag">넉넉</span>':''}${multi?`<small>${esc(c.code||'품번 미상')}</small>`:''}</span><span class="c-qty${c.total>0?'':' out'}">${c.total>0?n(c.total)+'족':'품절'}</span></div>${sizeGrid(c.sizes)}${c.inbound.length?c.inbound.map(inbHtml).join(''):any?'<p class="inb none">입고 예정 없음</p>':''}</div>`).join('');
return `<div class="stockline"><span class="total"><span class="total-l">자사몰 재고</span>${n(s.total)}<small>족</small></span>${next}</div>${badges?`<div class="badges">${badges}</div>`:''}<div class="cpills">${pills}</div><details class="more"><summary>색상·사이즈별 재고${any?' · 입고':''}</summary>${detail}</details>${storeHtml(p)}`}
function card(p){return `<article class="card" data-id="${p.id}"><div class="photo"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.name)} 상세페이지"><img src="${esc(p.image)}" alt="${esc(p.name)}" width="500" height="500" loading="lazy"></a><button class="pick" data-pick="${p.id}" aria-label="${esc(p.short_name)} 후보 선택" aria-pressed="${selected.has(p.id)}">${selected.has(p.id)?'✓':'+'}</button><span class="group">${esc(p.tags.join(' · '))}</span></div><div class="card-body"><div class="name-price"><h2>${esc(p.short_name)}</h2><span class="price">${p.price.toLocaleString('ko-KR')}원</span></div><p class="description" title="${esc(p.name)}">${esc(p.name.replace(p.short_name,'').trim())}</p>${stockHtml(p)}${p.note?`<p class="notes">${esc(p.note)}</p>`:''}<div class="card-links"><span class="codes">${p.codes.map(esc).join(' · ')}</span><a class="detail-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">상품 상세 ↗</a></div></div></article>`}
function base(){const q=$('#search').value.trim().toLocaleLowerCase();const category=$('#category').value;return products.filter(p=>(group==='전체'||p.tags.includes(group))&&(category==='전체'||p.category===category)&&(`${p.name} ${p.codes.join(' ')} ${cols(p).map(c=>c.color).join(' ')}`.toLocaleLowerCase().includes(q)))}
function render(){const b=base();const act=FILTERS.filter(([k])=>on.has(k));visible=b.filter(p=>act.every(([,,f])=>f(p)));const sort=$('#sort').value;if(sort==='stock')visible.sort((a,c)=>(c.stock?c.stock.total:0)-(a.stock?a.stock.total:0));if(sort==='name')visible.sort((a,c)=>a.name.localeCompare(c.name,'ko'));if(sort==='low')visible.sort((a,c)=>a.price-c.price);if(sort==='high')visible.sort((a,c)=>c.price-a.price);
$('#grid').innerHTML=visible.length?visible.map(card).join(''):'<div class="empty"><h2>조건에 맞는 상품이 없어요.</h2><p>검색어 또는 조건을 바꿔보세요.</p><button class="reset" id="reset">처음으로</button></div>';
$('#result-count').textContent=visible.length;$('#result-context').textContent=[group==='전체'?'':group,...act.map(([,l])=>l)].filter(Boolean).map(s=>'· '+s).join(' ');
document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.group===group)));document.querySelectorAll('[data-f]').forEach(t=>t.setAttribute('aria-pressed',String(on.has(t.dataset.f))));document.querySelectorAll('[data-kf]').forEach(t=>t.setAttribute('aria-pressed',String(on.has(t.dataset.kf))));
FILTERS.forEach(([k,,f])=>{const el=document.querySelector(`[data-fc="${k}"]`);if(el)el.textContent=b.filter(f).length});$('#selected-count').textContent=selected.size;$('#selection').hidden=!selected.size;$('#export').disabled=!visible.length}
function save(){try{localStorage.setItem('chaakan-winter-2026',JSON.stringify([...selected]))}catch{}$('#selected-count').textContent=selected.size;$('#selection').hidden=!selected.size}
function reset(){group='전체';on.clear();$('#search').value='';$('#category').value='전체';$('#sort').value='default';render()}
function toggle(k){on.has(k)?on.delete(k):on.add(k);render()}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(b){group=b.dataset.group;render()}});$('#fchips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b)toggle(b.dataset.f)});$('#kpis').addEventListener('click',e=>{const b=e.target.closest('[data-kf]');if(b){toggle(b.dataset.kf);$('#catalog').scrollIntoView({block:'start'})}});
$('#search').addEventListener('input',render);['category','sort'].forEach(id=>$('#'+id).addEventListener('change',render));
$('#grid').addEventListener('click',e=>{if(e.target.closest('#reset')){reset();return}const b=e.target.closest('[data-pick]');if(!b)return;const id=Number(b.dataset.pick);selected.has(id)?selected.delete(id):selected.add(id);save();if(on.has('sel')){render()}else{b.setAttribute('aria-pressed',String(selected.has(id)));b.textContent=selected.has(id)?'✓':'+';const el=document.querySelector('[data-fc="sel"]');if(el)el.textContent=base().filter(p=>selected.has(p.id)).length}});
$('#show-selected').addEventListener('click',()=>{group='전체';on.clear();on.add('sel');$('#search').value='';$('#category').value='전체';render();$('#catalog').scrollIntoView({block:'start'})});$('#clear').addEventListener('click',()=>{selected.clear();save();on.delete('sel');render()});
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function download(rows){if(!rows.length)return;const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const line=(p,c)=>{const s=p.stock||{total:'',as_of:''};const x=c&&c.inbound[0];return[p.tags.join(' / '),p.name,p.codes.join(' / '),p.price,p.url,s.total,c?c.color:'',c?(c.code||'품번 미상'):'',c?c.total:'',c?Object.entries(c.sizes).map(([k,v])=>k+':'+v).join(' '):'',x?(x.date||'미정'):'입고 예정 없음',x?(x.destination||'미상'):'',x?(x.factory_ship_date||'미정'):'',x?x.qty:'',x?(x.mall_expected_date||'미정'):'',x?(x.mall_estimate_basis||''):'',c?c.inbound.map(inbText).join(' / '):'',c?soonOf(c).map(i=>i.mall_expected_date+' '+i.qty+'족').join(' / '):'',c&&c.ample?'Y':'',c?(c.stores||[]).join('·'):'',s.as_of]};const body=[['구분','상품명','품번','공식몰 판매가','상품 링크','상품 총재고','색상','색상 품번','색상 재고','사이즈별 재고','다음 창고 예정일','입고 창고','공장 출고예정일','다음 입고 수량','자사몰 반영 예상일','예상 근거','입고 예정 전체',DL+' 전 자사몰 예상','재고 넉넉','매장 재고','재고 기준'],...rows.flatMap(p=>cols(p).length?cols(p).map(c=>line(p,c)):[line(p,null)])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='착한구두_겨울상품_'+rows.length+'종.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(rows.length+'개 상품을 내려받았습니다.')}

$('#export').addEventListener('click',()=>download(visible));$('#export-selected').addEventListener('click',()=>download(products.filter(p=>selected.has(p.id))));
$('#copy').addEventListener('click',async()=>{const text=products.filter(p=>selected.has(p.id)).map(p=>`${p.name}\n${p.codes.join(' / ')} · ${p.price.toLocaleString('ko-KR')}원${p.stock?` · 자사몰 재고 ${n(p.stock.total)}족`:''}${isAmple(p)?' · 재고 넉넉':''}${stores(p).length?` · 매장 재고 있음: ${stores(p).join('·')}`:''}\n${p.url}`).join('\n\n');try{await navigator.clipboard.writeText(text);toast(selected.size+'개 상품을 복사했습니다.')}catch{$('#copy-text').value=text;$('#copy-dialog').showModal();$('#copy-text').select()}});$('#close-dialog').addEventListener('click',()=>$('#copy-dialog').close());
{const st=products.find(p=>p.stock);if(st){const parts=[];if(st.stock.stores_as_of)parts.push(`매장 재고 ${kday(st.stock.stores_as_of)} 기준`);if(st.stock.inbound_basis)parts.push(`원본 DB·시트 조회 ${kday(st.stock.inbound_basis)}`);if(st.stock.factory_schedule_basis)parts.push(`공장 일정 ${kday(st.stock.factory_schedule_basis)} 기준`);parts.push('매장 재고·재고 넉넉은 ERP DB 직접 조회. 재고 넉넉 = 김포·위해·고산 자사몰용 3개 창고 합계 1,000족 이상(상품은 전체 색상 합계, 색상은 해당 색상 기준). 자사몰 반영 예상: 공장 출고 +7일 / 위해 도착 확인 +4일(달력일). 페탈 실적 기준 추정이며 확정일이 아닙니다. ERP 발주·실입고 DB와 생산관리 원천 시트를 직접 조회합니다. 원천에 반영된 최신 기록을 우선하며, 부분출고는 물량을 나눠 표시합니다.');$('#stock-note').textContent=parts.join(' · ')}}

render();
</script></body></html>
