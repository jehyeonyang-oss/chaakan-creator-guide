function card(p){return `<article class="card" data-id="${p.id}"><div class="photo"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.name)} 상세페이지"><img src="${esc(p.image)}" alt="${esc(p.name)}" width="800" height="800" loading="lazy"></a><button class="pick" data-pick="${p.id}" aria-label="${esc(p.short_name)} 후보 선택" aria-pressed="${selected.has(p.id)}">${selected.has(p.id)?'✓':'+'}</button><span class="group">${esc(p.group)}</span></div><div class="card-body"><div class="name-price"><h2>${esc(p.short_name)}</h2><span class="price">${p.price.toLocaleString('ko-KR')}원</span></div><p class="description">${esc(p.name.replace(p.short_name,'').trim())}</p><div class="codes">${p.codes.map(esc).join('<br>')}</div>${p.note?`<p class="notes">${esc(p.note)}</p>`:''}<div class="card-links"><a class="detail-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">상품 상세 ↗</a></div></div></article>`}
function render(){const q=$('#search').value.trim().toLocaleLowerCase();const category=$('#category').value;visible=products.filter(p=>(group==='전체'||p.group===group)&&(category==='전체'||p.category===category)&&(!$('#only-selected').checked||selected.has(p.id))&&(`${p.name} ${p.codes.join(' ')}`.toLocaleLowerCase().includes(q)));const sort=$('#sort').value;if(sort==='name')visible.sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(sort==='low')visible.sort((a,b)=>a.price-b.price);if(sort==='high')visible.sort((a,b)=>b.price-a.price);$('#grid').innerHTML=visible.length?visible.map(card).join(''):'<div class="empty"><h2>조건에 맞는 상품이 없어요.</h2><p>검색어 또는 필터를 바꿔보세요.</p><button class="reset" id="reset">전체 상품 보기</button></div>';$('#result-count').textContent=visible.length;$('#result-context').textContent=group==='전체'?'':`· ${group}`;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===group)));$('#selected-count').textContent=selected.size;$('#selection').hidden=!selected.size;$('#export').disabled=!visible.length}
function save(){try{localStorage.setItem('chaakan-winter-2026',JSON.stringify([...selected]))}catch{}$('#selected-count').textContent=selected.size;$('#selection').hidden=!selected.size}
function reset(){group='전체';$('#search').value='';$('#category').value='전체';$('#only-selected').checked=false;$('#sort').value='default';render()}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(b){group=b.dataset.group;render()}});$('#search').addEventListener('input',render);['category','sort','only-selected'].forEach(id=>$('#'+id).addEventListener('change',render));
$('#grid').addEventListener('click',e=>{if(e.target.closest('#reset')){reset();return}const b=e.target.closest('[data-pick]');if(!b)return;const id=Number(b.dataset.pick);selected.has(id)?selected.delete(id):selected.add(id);save();if($('#only-selected').checked){render()}else{b.setAttribute('aria-pressed',String(selected.has(id)));b.textContent=selected.has(id)?'✓':'+'}});
$('#show-selected').addEventListener('click',()=>{group='전체';$('#search').value='';$('#category').value='전체';$('#only-selected').checked=true;render();$('#catalog').scrollIntoView({block:'start'})});$('#clear').addEventListener('click',()=>{selected.clear();save();$('#only-selected').checked=false;render()});
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function download(rows){if(!rows.length)return;const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const body=[['구분','상품명','품번','공식몰 판매가','상품 링크'],...rows.map(p=>[p.group,p.name,p.codes.join(' / '),p.price,p.url])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='착한구두_겨울상품_'+rows.length+'종.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(rows.length+'개 상품을 내려받았습니다.')}$('#export').addEventListener('click',()=>download(visible));$('#export-selected').addEventListener('click',()=>download(products.filter(p=>selected.has(p.id))));
$('#copy').addEventListener('click',async()=>{const text=products.filter(p=>selected.has(p.id)).map(p=>`${p.name}\n${p.codes.join(' / ')} · ${p.price.toLocaleString('ko-KR')}원\n${p.url}`).join('\n\n');try{await navigator.clipboard.writeText(text);toast(selected.size+'개 상품을 복사했습니다.')}catch{$('#copy-text').value=text;$('#copy-dialog').showModal();$('#copy-text').select()}});$('#close-dialog').addEventListener('click',()=>$('#copy-dialog').close());render();
</script></body></html>
