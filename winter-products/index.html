<script>
'use strict';
const products=JSON.parse(document.querySelector('#product-data').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const known=new Set(products.map(p=>p.id));let selected=new Set();try{const saved=JSON.parse(localStorage.getItem('chaakan-winter-2026')||'[]');if(Array.isArray(saved))selected=new Set(saved.filter(id=>known.has(id)))}catch{}let group='전체';let visible=[];
const n=v=>Number(v||0).toLocaleString('ko-KR');const md=d=>{const a=String(d).split('-');return `${+a[1]}/${+a[2]}`};const hasInb=p=>!!p.stock&&p.stock.colors.some(c=>c.inbound.length);const isLow=p=>!!p.stock&&p.stock.colors.some(c=>c.total<10);
function nextInb(p){const all=p.stock?p.stock.colors.flatMap(c=>c.inbound):[];const d=all.filter(x=>!x.pending).sort((a,b)=>a.date.localeCompare(b.date))[0];return d||all.find(x=>x.pending)||null}
function chips(sz,plain){return Object.entries(sz||{}).map(([s,q])=>plain||q>0?`<span class="chip${!plain&&q<10?' low':''}">${esc(s)}<b>${n(q)}</b></span>`:`<span class="chip out">${esc(s)}<b>품절</b></span>`).join('')}
function inbText(x){return x.pending?`입고 일정 조율 중 · ${n(x.qty)}족`:`${md(x.date)} 입고 예정 · ${n(x.qty)}족`}
function inbHtml(x){const cl=`inb${x.pending?' pending':''}`;return Object.keys(x.sizes||{}).length?`<details class="${cl}"><summary>${inbText(x)}</summary><div class="chips">${chips(x.sizes,1)}</div></details>`:`<p class="${cl}">${inbText(x)}</p>`}
function stockHtml(p){const s=p.stock;if(!s)return '';const multi=new Set(s.colors.map(c=>c.code)).size>1;const nx=nextInb(p);const any=hasInb(p);const sum=nx?`<p class="inb-sum${nx.pending?' pending':''}">${nx.pending?'입고 일정 조율 중':'다음 입고 '+md(nx.date)+' · '+n(nx.qty)+'족'}</p>`:'<p class="inb-sum none">입고 예정 없음</p>';return `<section class="stock" aria-label="${esc(p.short_name)} 자사몰 재고"><div class="stock-head"><span>자사몰 재고</span><b>${n(s.total)}족</b></div>${sum}<ul class="colors">${s.colors.map(c=>`<li><div class="c-top"><span class="c-name">${esc(c.color)}${multi?`<small>${esc(c.code||'품번 미상')}</small>`:''}</span><span class="c-qty${c.total>0?'':' out'}">${c.total>0?n(c.total)+'족':'품절'}</span></div><div class="chips">${chips(c.sizes)}</div>${c.inbound.length?c.inbound.map(inbHtml).join(''):any?'<p class="inb none">입고 예정 없음</p>':''}</li>`).join('')}</ul></section>`}
const groups=['전체','26FW 신상','기존 방한상품','키즈'];$('.tabs').innerHTML=groups.map(g=>`<button class="tab" data-group="${g}" aria-pressed="${g===group}">${g}<span class="count">${g==='전체'?products.length:products.filter(p=>p.group===g).length}</span></button>`).join('');
[...new Set(products.map(p=>p.category))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('#category').append(o)});
function card(p){return `<article class="card" data-id="${p.id}"><div class="photo"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(p.name)} 상세페이지"><img src="${esc(p.image)}" alt="${esc(p.name)}" width="800" height="800" loading="lazy"></a><button class="pick" data-pick="${p.id}" aria-label="${esc(p.short_name)} 후보 선택" aria-pressed="${selected.has(p.id)}">${selected.has(p.id)?'✓':'+'}</button><span class="group">${esc(p.group)}</span></div><div class="card-body"><div class="name-price"><h2>${esc(p.short_name)}</h2><span class="price">${p.price.toLocaleString('ko-KR')}원</span></div><p class="description">${esc(p.name.replace(p.short_name,'').trim())}</p><div class="codes">${p.codes.map(esc).join('<br>')}</div>${p.note?`<p class="notes">${esc(p.note)}</p>`:''}${stockHtml(p)}<div class="card-links"><a class="detail-link" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">상품 상세 ↗</a></div></div></article>`}
function render(){const q=$('#search').value.trim().toLocaleLowerCase();const category=$('#category').value;const sf=$('#stock-filter').value;visible=products.filter(p=>(group==='전체'||p.group===group)&&(category==='전체'||p.category===category)&&(!$('#only-selected').checked||selected.has(p.id))&&(`${p.name} ${p.codes.join(' ')}`.toLocaleLowerCase().includes(q))&&(sf==='all'||(sf==='in'&&!!p.stock&&p.stock.total>0)||(sf==='low'&&isLow(p))||(sf==='inb'&&hasInb(p))));const sort=$('#sort').value;if(sort==='name')visible.sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(sort==='low')visible.sort((a,b)=>a.price-b.price);if(sort==='high')visible.sort((a,b)=>b.price-a.price);$('#grid').innerHTML=visible.length?visible.map(card).join(''):'<div class="empty"><h2>조건에 맞는 상품이 없어요.</h2><p>검색어 또는 필터를 바꿔보세요.</p><button class="reset" id="reset">전체 상품 보기</button></div>';$('#result-count').textContent=visible.length;$('#result-context').textContent=group==='전체'?'':`· ${group}`;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===group)));$('#selected-count').textContent=selected.size;$('#selection').hidden=!selected.size;$('#export').disabled=!visible.length}
function save(){try{localStorage.setItem('chaakan-winter-2026',JSON.stringify([...selected]))}catch{}$('#selected-count').textContent=selected.size;$('#selection').hidden=!selected.size}
function reset(){group='전체';$('#search').value='';$('#category').value='전체';$('#stock-filter').value='all';$('#only-selected').checked=false;$('#sort').value='default';render()}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(b){group=b.dataset.group;render()}});$('#search').addEventListener('input',render);['category','sort','only-selected','stock-filter'].forEach(id=>$('#'+id).addEventListener('change',render));
$('#grid').addEventListener('click',e=>{if(e.target.closest('#reset')){reset();return}const b=e.target.closest('[data-pick]');if(!b)return;const id=Number(b.dataset.pick);selected.has(id)?selected.delete(id):selected.add(id);save();if($('#only-selected').checked){render()}else{b.setAttribute('aria-pressed',String(selected.has(id)));b.textContent=selected.has(id)?'✓':'+'}});
$('#show-selected').addEventListener('click',()=>{group='전체';$('#search').value='';$('#category').value='전체';$('#stock-filter').value='all';$('#only-selected').checked=true;render();$('#catalog').scrollIntoView({block:'start'})});$('#clear').addEventListener('click',()=>{selected.clear();save();$('#only-selected').checked=false;render()});
let toastTimer;function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function download(rows){if(!rows.length)return;const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const line=(p,c)=>{const s=p.stock||{total:'',as_of:''};const x=c&&c.inbound[0];return[p.group,p.name,p.codes.join(' / '),p.price,p.url,s.total,c?c.color:'',c?(c.code||'품번 미상'):'',c?c.total:'',c?Object.entries(c.sizes).map(([k,v])=>k+':'+v).join(' '):'',x?(x.pending?'입고 일정 조율 중':x.date):'입고 예정 없음',x?x.qty:'',c?c.inbound.map(i=>(i.pending?'일정 조율 중':i.date)+' '+i.qty+'족').join(' / '):'',s.as_of]};const body=[['구분','상품명','품번','공식몰 판매가','상품 링크','상품 총재고','색상','색상 품번','색상 재고','사이즈별 재고','다음 입고 예정일','다음 입고 수량','입고 예정 전체','재고 기준'],...rows.flatMap(p=>p.stock&&p.stock.colors.length?p.stock.colors.map(c=>line(p,c)):[line(p,null)])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='착한구두_겨울상품_'+rows.length+'종.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(rows.length+'개 상품을 내려받았습니다.')}$('#export').addEventListener('click',()=>download(visible));$('#export-selected').addEventListener('click',()=>download(products.filter(p=>selected.has(p.id))));
$('#copy').addEventListener('click',async()=>{const text=products.filter(p=>selected.has(p.id)).map(p=>`${p.name}\n${p.codes.join(' / ')} · ${p.price.toLocaleString('ko-KR')}원${p.stock?` · 자사몰 재고 ${n(p.stock.total)}족`:''}\n${p.url}`).join('\n\n');try{await navigator.clipboard.writeText(text);toast(selected.size+'개 상품을 복사했습니다.')}catch{$('#copy-text').value=text;$('#copy-dialog').showModal();$('#copy-text').select()}});$('#close-dialog').addEventListener('click',()=>$('#copy-dialog').close());{const st=products.find(p=>p.stock);if(st&&st.stock.inbound_basis){const a=st.stock.inbound_basis.split('-');$('#stock-note').textContent=`입고 예정 ${+a[1]}월 ${+a[2]}일 기준 · 예정일은 변동될 수 있어요.`}}render();
</script></body></html>
