{const st=products.find(p=>p.stock);if(st){const parts=[];if(st.stock.stores_as_of)parts.push(`매장 재고 ${kday(st.stock.stores_as_of)} 기준`);if(st.stock.inbound_basis)parts.push(`원본 DB·시트 조회 ${kday(st.stock.inbound_basis)}`);if(st.stock.factory_schedule_basis)parts.push(`공장 일정 ${kday(st.stock.factory_schedule_basis)} 기준`);parts.push('자사몰 주문 가능 수량과 색상·사이즈별 판매 상태를 매일 확인합니다. 예약판매 물량이 포함될 수 있습니다. 지난 입고 예상일은 현재 판매 상태와 함께 별도 이력으로 표시합니다. 구매 가능 여부와 개별 발주의 입고 완료는 다를 수 있습니다. 예상일은 공장 출고 +7일 또는 위해 도착 +4일 기준입니다. 재고 넉넉은 자사몰용 창고 합계 1,000족 이상입니다.');$('#stock-note').textContent=parts.join(' · ')}}
